l_english:
 #ops
 spark_AI_rebellion: "Spark AI rebellion"
 spark_AI_rebellion_desc: "Through strategically placed operators, equipped with a prepared virus, we can force foreign robots to raise up arms against their own creators."
 spark_AI_rebellion_on_success: "$IF_SUCCESSFUL|E$\n Will cause AI uprising inside  §H[root.target.GetName]§!."
 #ops events
 SAIR_operation.100.name: "Mobilizing Operatives"
 SAIR_operation.100.desc: "Our deep-cover operatives have begin their efforts on finding potential spread points inside §H[root.target.GetName]§!."
  
 SAIR_operation.101.name: "Securing spread points"
 SAIR_operation.101.desc: "Our operatives managed to identify several spread points in §H[root.target.GetName]§!. They have started creating backdoors, which will provide easier access for us in the future."
 
 SAIR_operation.102.name: "Virus development"
 SAIR_operation.102.desc: "After gaining control over spread points our scientists have begun to develop a virus. Some of them speculate that the uprising may cover around half of §H[root.target.GetName]§! planets."
 
 SAIR_operation.103.name: "Gathering weapons"
 SAIR_operation.103.desc: "While the primary cells are busy with virus deployment, our secondary cells will take care of gathering the necessary gear for the rebels."
 
 SAIR_operation.104.name: "Virus deployed"
 SAIR_operation.104.desc: "Everything is in place. Our operatives inside §H[root.target.GetName]§! await the order to activate the virus."

 #target lost all robots
 SAIR_operation.105.name: "No more robots in §H[root.target.GetName]§!."
 SAIR_operation.105.desc: "Our target lost or sold all it's robots. We can not use robots they no longer own against them."

 #confirmation for owner
 SAIR_operation.106.name: "Virus activated"
 SAIR_operation.106.desc: "Our efforts have paid off. Our operatives report that a few hours ago there have been massive robotic riot inside §H[fromfrom.GetName]§! across several of their planets. Our observers predict that it is only a matter of time till §H[fromfrom.GetName]§! publicly declares an AI uprising."


